<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimizer PC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="icon" type="image/png" href="./img/logos/MinimalistModernSimpleLogo.png">
</head>
<body>

    <div class="wrapper">

        <!-- Header móvil principal -->
        <header class="header-mobile">
            <h1 class="logo">Optimizer PC - Administrador</h1>

            <button class="open-menu" id="open-menu">
                <i class="bi bi-list"></i>
            </button>

            <div id="welcome-msg" style="color:white; margin-left: 10px;">Bienvenido</div>

            <button id="logout-btn" title="Cerrar sesión">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </header>


        <aside>
            <button class="close-menu" id="close-menu">
                <i class="bi bi-x"></i>
            </button>

            <header>
                <h1 class="logo">Optimizer PC</h1>
            </header>

            <nav>
                <ul class="menu">
                    <li>
                        <button id="todos" class="boton-menu boton-categoria active"><i class="bi bi-hand-index-thumb-fill"></i> Gestionar</button>
                    </li>
                    <li>
                        <button id="logout-menu-btn" class="boton-menuSession boton-categoria cerrar-sesion">
                            <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                        </button>
                    </li>                   
                    </li>
                </ul>
            </nav>

            <footer>
                <p class="texto-footer">© 2025 Juanca Services</p>
            </footer>
        </aside>

        <!-- Contenido principal -->
        <main>
            <h2 class="titulo-principal" id="titulo-principal">Gestionar productos y ventas de la tienda</h2>
            <section class="chart-container">
                <div class="chart-wrapper">
                  <canvas id="salesChart"></canvas>
                </div>
            </section>    
            <section class="formulario-agregar">
                <h2 class="chart-title">Agregar nuevo producto</h2>
                <form id="product-form" enctype="multipart/form-data">
                    <input type="text" name="name" placeholder="Nombre del producto" required>
                    <input type="number" name="price" placeholder="Precio" step="0.01" required>
                    <input type="file" name="image" accept="image/*" required>
            
                    <div id="category-checkboxes">
                    
                    </div>
            
                    <button type="submit">Agregar producto</button>
                </form>
            </section>                      
        </main>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="./js/admin.js"></script>
    <script src="./js/menu.js"></script>

    <script>
       function cerrarSesion() {
          localStorage.clear();
          Toastify({
            text: "Sesión cerrada",
            duration: 2000,
            gravity: "top",
            position: "right",
            style: { background: "#dc3545" }
          }).showToast();
      
          setTimeout(() => {
            window.location.href = "/OptimizerPC_Front/login/login.html"; 
          }, 2000);
        }
      
        // Asignar función de cerrar sesión a los botones
        const logoutBtnHeader = document.getElementById("logout-btn");
        const logoutBtnMenu = document.getElementById("logout-menu-btn");
      
        if (logoutBtnHeader) logoutBtnHeader.addEventListener("click", cerrarSesion);
        if (logoutBtnMenu) logoutBtnMenu.addEventListener("click", cerrarSesion);
      </script>
</body>
</html>
