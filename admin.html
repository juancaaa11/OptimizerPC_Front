<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Optimizer PC - Administrador</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="icon" type="image/png" href="./img/logos/MinimalistModernSimpleLogo.png" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link href="https://fonts.googleapis.com/css?family=Titillium+Web:400,600,700" rel="stylesheet" />
    <style>
      #search-results {
        max-height: 300px;
        overflow-y: auto;
        border: 1px solid #ccc;
        padding: 0.5rem;
        margin-top: 0.5rem;
        background: #ffffff;
        border-radius: 4px;
      }
      .producto {
        padding: 0.5rem;
        border-bottom: 1px solid #eee;
      }
      .producto:last-child {
        border-bottom: none;
      }
      .search-container input[type="search"] {
        width: 100%;
        padding: 0.5rem;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      .btn-eliminar {
        background-color: #dc3545;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: 600;
        transition: background-color 0.3s ease;
      }
      .btn-eliminar:hover {
        background-color: #b02a37;
      }
    </style>
</head>
<body>
  <div class="wrapper">
    <!-- Header móvil principal -->
    <header class="header-mobile">
      <h1 class="logo">Optimizer PC - Administrador</h1>
      <button class="open-menu" id="open-menu">
        <i class="bi bi-list"></i>
      </button>
      <div id="welcome-msg" style="color:white; margin-left: 10px;">Bienvenido</div>
    </header>

    <aside>
      <button class="close-menu" id="close-menu">
        <i class="bi bi-x"></i>
      </button>
      <header>
        <h1 class="logo">Optimizer PC</h1>
      </header>
      <nav>
        <ul class="menu">
          <li>
            <button id="todos" class="boton-menu boton-categoria active"><i class="bi bi-hand-index-thumb-fill"></i> Gestionar</button>
          </li>
          <li>
            <button id="logout-menu-btn" class="boton-menuSession boton-categoria cerrar-sesion">
              <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
            </button>
          </li>
        </ul>
      </nav>
      <footer>
        <p class="texto-footer">© 2025 Juanca Services</p>
      </footer>
    </aside>

    <main>
      <section class="chart-container">
        <div id="salesChart"></div>
      </section>

      <section class="formulario-agregar">
        <h2 class="section-title">🛒 Agregar nuevo producto</h2>
        <form id="product-form" enctype="multipart/form-data">
          <input type="text" name="name" placeholder="Nombre del producto" required />
          <input type="number" name="price" placeholder="Precio" step="0.01" required />
          <label for="product-image" class="custom-file-upload">
            <i class="fas fa-cloud-upload-alt"></i> Subir imagen
          </label>
          <input type="file" id="product-image" name="image" accept="image/*" required />
          <div id="category-checkboxes"></div>
          <button type="submit">Agregar producto</button>
          <p id="file-name" style="margin-top: 0.5rem; color: #555;"></p>
          <button type="button" id="remove-image" style="margin-left: 1rem; display: none;">❌ Eliminar imagen</button>
        </form>
      </section>

      <section class="formulario-agregar">
        <h2 class="section-title">❌ Borrar productos</h2>
        <form id="delete-product-form" onsubmit="return false;">
          <div class="search-container">
            <input type="search" id="search-input" placeholder="Buscar producto por nombre..." autocomplete="off" />
          </div>
          <div id="search-results"></div>
        </form>
      </section>
    </main>
  </div>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.slim.min.js"></script>
  <script src="./js/admin.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./js/menu.js"></script>

  <script>
    // ======= Cerrar sesión =======
    function cerrarSesion() {
      localStorage.clear();
      Toastify({
        text: "Sesión cerrada",
        duration: 2000,
        gravity: "top",
        position: "right",
        style: { background: "#dc3545" }
      }).showToast();

      setTimeout(() => {
        window.location.href = "/OptimizerPC_Front/login/login.html";
      }, 2000);
    }

    const logoutBtnMenu = document.getElementById("logout-menu-btn");
    if (logoutBtnMenu) logoutBtnMenu.addEventListener("click", cerrarSesion);

    // ======= Gestión de imagen cargada =======
    const fileInput = document.getElementById("product-image");
    const fileNameDisplay = document.getElementById("file-name");
    const removeBtn = document.getElementById("remove-image");

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (file) {
        fileNameDisplay.textContent = `📁 Imagen cargada: ${file.name}`;
        removeBtn.style.display = "inline-block";
        Toastify({
          text: "Imagen cargada correctamente",
          duration: 3000,
          gravity: "top",
          position: "right",
          style: { background: "#28a745", color: "#fff" },
          stopOnFocus: true,
        }).showToast();
      } else {
        fileNameDisplay.textContent = "";
        removeBtn.style.display = "none";
      }
    });

    removeBtn.addEventListener("click", () => {
      fileInput.value = "";
      fileNameDisplay.textContent = "";
      removeBtn.style.display = "none";
      Toastify({
        text: "Imagen eliminada",
        duration: 3000,
        gravity: "top",
        position: "right",
        style: { background: "#dc3545", color: "#fff" },
        stopOnFocus: true,
      }).showToast();
    });

    // ======= Gestión de productos con buscador y scroll =======
    let productos = [];

    const searchInput = document.getElementById("search-input");
    const searchResults = document.getElementById("search-results");

    // Carga inicial de todos los productos
    fetch("https://optimizerpcback-production.up.railway.app/v0/s/article")
      .then(response => response.json())
      .then(data => {
        productos = data;
        cargarProductos(productos);
      })
      .catch(err => {
        searchResults.innerHTML = "<p style='color:red;'>Error al cargar productos.</p>";
        console.error(err);
      });

    // Mostrar productos en contenedor con scroll
    function cargarProductos(productosArray) {
      searchResults.innerHTML = "";
      if (!productosArray.length) {
        searchResults.innerHTML = "<p>No se encontraron productos.</p>";
        return;
      }
      productosArray.forEach(prod => {
        const div = document.createElement("div");
        div.classList.add("producto");
        div.dataset.id = prod.id; // Guarda id en el div para referencia

        div.innerHTML = `
          <div style="display:flex; justify-content: space-between; align-items: center;">
            <div>
              <h3>${prod.name}</h3>
              <p>Precio: $${prod.price.toFixed(2)}</p>
            </div>
            <button class="btn-eliminar" type="button" aria-label="Eliminar producto">
              <i class="bi bi-trash"></i> Eliminar
            </button>
          </div>
        `;

        searchResults.appendChild(div);
      });

      // Añadir listener a todos los botones eliminar
      // Nota: Se añade aquí para que siempre se vincule a los botones actuales
      const botonesEliminar = searchResults.querySelectorAll(".btn-eliminar");
      botonesEliminar.forEach(button => {
        button.addEventListener("click", eliminarProducto);
      });
    }

    // Buscar productos al escribir con debounce
    let debounceTimer;
    searchInput.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        const query = searchInput.value.trim().toLowerCase();
        if (query.length > 2) {
          fetch(`https://optimizerpcback-production.up.railway.app/v0/s/article?search=${encodeURIComponent(query)}`)
            .then(res => res.json())
            .then(data => {
              cargarProductos(data);
            })
            .catch(err => {
              searchResults.innerHTML = "<p style='color:red;'>Error al buscar productos.</p>";
              console.error(err);
            });
        } else if (query.length === 0) {
          cargarProductos(productos);
        }
      }, 300);
    });

  function eliminarProducto(event) {
  const boton = event.target.closest("button.btn-eliminar");
  if (!boton) return;

  const productoDiv = boton.closest(".producto");
  if (!productoDiv) return;

  const productoId = productoDiv.dataset.id;
  if (!productoId) return;

  Swal.fire({
    title: '¿Estás seguro?',
    icon: 'question',
    html: `Vas a borrar el producto con ID: <b>${productoId}</b>.`,
    showCancelButton: true,
    focusConfirm: false,
    confirmButtonText: 'Sí',
    cancelButtonText: 'No'
  }).then((result) => {
    if (result.isConfirmed) {
      fetch(`https://optimizerpcback-production.up.railway.app/v0/article/${productoId}`, {
        method: "DELETE",
      })
      .then(response => {
        if (!response.ok) {
          throw new Error("No se pudo eliminar el producto");
        }
        // Quita el producto del array y del DOM
        productos = productos.filter(p => p.id !== productoId);
        productoDiv.remove();

        Swal.fire({
          title: '¡Producto eliminado!',
          icon: 'success',
          timer: 1500,
          showConfirmButton: false
        });
         Toastify({
        text: "Producto eliminado",
        duration: 3000,
        gravity: "top",
        position: "right",
        style: { background: "#dc3545", color: "#fff" },
        stopOnFocus: true,
      }).showToast();
      })
      .catch(error => {
        Swal.fire({
          title: 'Error',
          text: error.message,
          icon: 'error',
          confirmButtonText: 'Ok'
        });
      });
    }
  });
}

  </script>
</body>
</html>
