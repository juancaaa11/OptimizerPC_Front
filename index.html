<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimizer PC - Inicio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="icon" type="image/png" href="./img/logos/MinimalistModernSimpleLogo.png">
</head>
<body>

    <div class="wrapper">

        <!-- Aside menú lateral -->
        <aside>
            <button class="close-menu" id="close-menu">
                <i class="bi bi-x"></i>
            </button>

            <header>
                <h1 class="logo">Optimizer PC</h1>
            </header>

            <nav>
                <ul class="menu">
                    <li>
                        <button id="todos" class="boton-menu boton-categoria active"><i class="bi bi-hand-index-thumb-fill"></i> Todos los productos</button>
                    </li>
                    <li>
                        <button id="OPTIMIZATION" class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb"></i> Optimizaciones</button>
                    </li>
                    <li>
                        <button id="CLEANING" class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb"></i> Limpiezas</button>
                    </li>
                    <li>
                        <button id="REPAIR" class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb"></i> Reparaciones</button>
                    </li>
                    <li>
                        <a class="boton-menu boton-carrito" href="./carrito.html">
                            <i class="bi bi-cart-fill"></i> Carrito <span id="numerito" class="numerito">0</span>
                        </a>
                    </li>
                    <li>
                        <button id="logout-menu-btn" class="boton-menuSession boton-categoria cerrar-sesion">
                            <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                        </button>
                    </li>            
                </ul>
            </nav>

            <footer>
                <p class="texto-footer">© 2025 Juanca Services</p>
            </footer>
        </aside>

        <!-- Contenido principal -->
        <main>
            <h2 class="titulo-principal" id="titulo-principal">Todos los productos</h2>
            <div id="contenedor-productos" class="contenedor-productos">
                <!-- Esto se va a rellenar con JS -->
            </div>
        </main>

    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/menu.js"></script>
    <script>
        // Mostrar nombre de usuario en mensaje de bienvenida
        const username = localStorage.getItem('username') || 'Invitado';
        const welcomeMsg = document.getElementById('welcome-msg');
        if (welcomeMsg) {
          welcomeMsg.textContent = `Bienvenido, ${username}`;
        }
      
        // Función para cerrar sesión
        function cerrarSesion() {
          localStorage.clear();
          Toastify({
            text: "Sesión cerrada",
            duration: 2000,
            gravity: "top",
            position: "right",
            style: { background: "#dc3545" }
          }).showToast();
      
          setTimeout(() => {
            window.location.href = "/OptimizerPC_Front/login/login.html"; 
          }, 2000);
        }
      
        // Asignar función de cerrar sesión a los botones
        const logoutBtnHeader = document.getElementById("logout-btn");
        const logoutBtnMenu = document.getElementById("logout-menu-btn");
      
        if (logoutBtnHeader) logoutBtnHeader.addEventListener("click", cerrarSesion);
        if (logoutBtnMenu) logoutBtnMenu.addEventListener("click", cerrarSesion);
      </script>
      
</body>
</html>
